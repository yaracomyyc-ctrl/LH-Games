<main>
  <section id="section-banner" aria-label="Destaques da loja">
    <div id="carouselDestaques" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselDestaques" data-bs-slide-to="0"
          class="active" aria-current="true" aria-label="Primeiro banner"></button>
        <button type="button" data-bs-target="#carouselDestaques" data-bs-slide-to="1"
          aria-label="Segundo banner"></button>
        <button type="button" data-bs-target="#carouselDestaques" data-bs-slide-to="2"
          aria-label="Terceiro banner"></button>
      </div>

      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="assets/img/banner1.PNG" class="d-block w-100"
            alt="Banner com desenhos de controles de videogame em neon">
        </div>
        <div class="carousel-item">
          <img src="assets/img/banner2.PNG" class="d-block w-100"
            alt="Banner promocional da loja de jogos">
        </div>
        <div class="carousel-item">
          <img src="assets/img/banner3.PNG" class="d-block w-100"
            alt="Banner com destaque para jogos eletrônicos">
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carouselDestaques"
        data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carouselDestaques"
        data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Próximo</span>
      </button>
    </div>
  </section>

  <section class="container produtos" aria-labelledby="titulo-produtos">
    <h1 id="titulo-produtos">Jogos em promoção</h1>
    <p class="subtitulo">Escolha seu próximo jogo e aproveite as ofertas.</p>

    <div class="row g-4">
      <!-- O *ngFor evita repetir o mesmo HTML para cada jogo. -->
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let jogo of jogos">
        <mat-card class="jogo-card">
          <img mat-card-image [src]="jogo.imagem" [alt]="jogo.nome">

          <mat-card-header>
            <mat-card-title>{{ jogo.nome }}</mat-card-title>
          </mat-card-header>

          <mat-card-content>
            <p>{{ jogo.descricao }}</p>
          </mat-card-content>

          <mat-card-actions>
            <strong>{{ jogo.preco | currency:'BRL' }}</strong>
            <button mat-raised-button color="primary" (click)="comprar(jogo)">
              Comprar
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  </section>
</main>
