<main class="container py-4">
  <div class="card border-0 shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
      <p class="text-primary fw-semibold mb-1">PRODUTOS</p>
      <h1 class="h2">{{ editando ? 'Editar produto' : 'Cadastrar produto' }}</h1>
      <p class="text-muted">
        {{ editando ? 'Altere os dados e salve o produto.' : 'Preencha os dados para incluir um jogo na loja.' }}
      </p>

      <div *ngIf="mensagemErro" class="alert alert-danger" role="alert">
        {{ mensagemErro }}
      </div>

      <form #produtoForm="ngForm" (ngSubmit)="salvar()">
        <div class="mb-3">
          <label for="produto" class="form-label">Nome do produto</label>
          <input
            id="produto"
            name="produto"
            class="form-control"
            type="text"
            [(ngModel)]="produto.produto"
            required
            minlength="2"
            placeholder="Ex.: Neon Challenge">
        </div>

        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição</label>
          <textarea
            id="descricao"
            name="descricao"
            class="form-control"
            rows="4"
            [(ngModel)]="produto.descricao"
            required
            placeholder="Digite uma breve descrição do jogo"></textarea>
        </div>

        <div class="row">
          <div class="col-md-7 mb-3">
            <label for="foto" class="form-label">Nome do arquivo da foto</label>
            <input
              id="foto"
              name="foto"
              class="form-control"
              type="text"
              [(ngModel)]="produto.foto"
              required
              placeholder="Ex.: jogo1.PNG">
            <div class="form-text">A imagem deve estar na pasta src/assets/img.</div>
          </div>

          <div class="col-md-5 mb-3">
            <label for="preco" class="form-label">Preço (R$)</label>
            <input
              id="preco"
              name="preco"
              class="form-control"
              type="number"
              [(ngModel)]="produto.preco"
              required
              min="0.01"
              step="0.01"
              placeholder="0,00">
          </div>
        </div>

        <div *ngIf="produto.foto" class="previsualizacao mb-4">
          <span class="form-label d-block">Pré-visualização</span>
          <img [src]="'assets/img/' + produto.foto" [alt]="'Prévia de ' + produto.produto">
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-primary" type="submit" [disabled]="produtoForm.invalid || salvando">
            {{ salvando ? 'Salvando...' : 'Salvar produto' }}
          </button>
          <button class="btn btn-outline-secondary" type="button" (click)="cancelar()" [disabled]="salvando">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</main>
